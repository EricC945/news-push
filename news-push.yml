name: 每日新闻自动推送

on:
  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行新闻推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python cloud_news.py

      - name: 运行失败通知
        if: failure()
        run: |
          echo "::error::新闻推送失败，请检查 ServerChan key 或网络"